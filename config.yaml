# Competitor Intelligence Pipeline Configuration

# Data Sources for Discovery (Skill 1)
data_sources:
  mining_industry_news:
    - name: "mining.com"
      url: "https://mining.com"
      category: "mining_news"
      priority: 1
    
    - name: "mining-weekly.com"
      url: "https://miningweekly.com"
      category: "mining_news"
      priority: 1
    
    - name: "discoveryalert.com.au"
      url: "https://discoveryalert.com.au"
      category: "exploration_news"
      priority: 1
  
  regulatory_data:
    - name: "USGS Periodicals"
      url: "https://pubs.usgs.gov/periodicals/"
      category: "mineral_production"
      priority: 2
    
    - name: "Canada Natural Resources"
      url: "https://natural-resources.canada.ca"
      category: "mining_data"
      priority: 2
  
  academic:
    - name: "arXiv (geology + AI)"
      url: "https://arxiv.org"
      categories: ["geo-ph", "cs.LG"]
      priority: 3
  
  investor_portfolios:
    - name: "LinkedIn Mining Ventures"
      url: "https://linkedin.com"
      search_terms: ["mining ventures", "mineral tech", "critical minerals"]
      priority: 2
    
    - name: "Crunchbase"
      url: "https://crunchbase.com"
      filters: ["mining", "geology", "AI", "critical minerals"]
      priority: 1
    
    - name: "PitchBook"
      url: "https://pitchbook.com"
      filters: ["mining", "minerals", "exploration tech"]
      priority: 1
    
    - name: "Y Combinator Database"
      url: "https://www.ycombinator.com"
      filters: ["mining", "materials", "earth tech"]
      priority: 2
    
    - name: "BHP Ventures"
      url: "https://bhpventures.com"
      category: "corporate_venture"
      priority: 1
    
    - name: "Rio Tinto Ventures"
      url: "https://riotinto.com"
      category: "corporate_venture"
      priority: 1

# Google Sheets Configuration
google_sheets:
  sheet_id: "1e9gbtCVgzp2RdWyThrdl_eEs62n63Nto3aSQtH5FXHM"
  tabs:
    companies: "companies"
    events: "events"
    update_log: "update_log"
    raw_signals: "raw_signals"
    discovery_queue: "discovery_queue"

# Company Fields to Track
company_fields:
  core:
    - canonical_name
    - website
    - linkedin_url
    - founded_year
    - hq_city
    - hq_country
  
  team:
    - founders
    - team_size
  
  capital:
    - investors
    - latest_round_type
    - latest_round_amount_usd
    - latest_round_date
    - funding_trajectory
    - valuation
  
  product:
    - business_model
    - technical_stage
    - core_product
    - pricing_model
    - target_customer
  
  metadata:
    - status  # active, acquired, stealth, related, discovered
    - last_updated
    - confidence_score
    - discovered_source

# Event Types to Track (Skill 2)
event_types:
  - funding_round
  - acquisition
  - leadership_change
  - product_launch
  - partnership
  - hiring_surge
  - expansion
  - news_mention

# Merge Configuration (Skill 2)
merge_strategy:
  # Cross-validation based merging
  # Rule: If 2+ trusted sources agree, AUTO-MERGE immediately. No human review needed.
  # Trusted sources (authoritative, must be verified):
  # - Official company website
  # - LinkedIn company profile
  # - Official investor/VC announcements
  # - Press releases
  # - SEC filings (if applicable)
  
  trusted_sources:
    - official_website
    - linkedin_company_profile
    - investor_official_announcement
    - press_release
    - sec_filing
  
  # Merge rules
  merge_policy:
    cross_validated: "AUTO-MERGE"  # 2+ trusted sources agree → merge immediately
    single_source_official: "ACCEPT"  # 1 trusted source → accept if authoritative
    low_confidence: "DISCARD_AND_LOG"  # Unverified sources → discard, log reason
  
  # Critical constraint: NO HALLUCINATION
  source_requirement: "MUST_HAVE_ACTUAL_VERIFIABLE_SOURCE"
  unknown_fields: "LEAVE_EMPTY"  # If source unclear, leave blank rather than guess
  
  # Fallback: If confidence < 50%, require source verification

# Scraping Targets (Skill 2)
scrape_targets:
  - company_website
  - linkedin_company_profile
  - news_search
  - job_postings
  - team_pages

# Scheduling
schedule:
  cron: "0 18 * * *"  # 18:00 EST daily (UTC-5, or UTC-4 during EDT)
  timezone: "America/New_York"
  expected_duration:
    skill_1: 15  # minutes (discovery)
    skill_2: 45  # minutes (research, varies with company count)
    skill_3: 10  # minutes (dashboard export)
  
  # Run order (sequential, no parallelization)
  run_order:
    - skill_1: competitor-discovery
    - skill_2: competitor-research
    - skill_3: competitor-dashboard

# GitHub Integration (Skill 3)
github:
  enabled: true
  repo: "mohan-competitive-intelligence"
  branch: "main"
  push_targets:
    - path: "/data/competitors.csv"
      source: "companies_tab"
    - path: "/data/events.csv"
      source: "events_tab"
    - path: "/data/update_log.csv"
      source: "update_log_tab"
    - path: "/dashboard/index.html"
      source: "generated_html"
  
  archive_path: "/data/archive/"
  commit_message_template: "[auto] daily update — {date}"

# Logging
logging:
  level: "INFO"
  file: "logs/pipeline.log"
  retention_days: 30

