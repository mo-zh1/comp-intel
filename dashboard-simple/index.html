<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Competitor Intel</title>
<script src="./d3.min.js"></script>
<style>
:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --border:#2a2a2a;
  --gold:#C9A442; --gold-dim:#7a6028;
  --text:#e5e5e5; --muted:#6b6b6b;
  --green:#4ade80; --green-bg:#0d2b1a;
  --purple:#a78bfa; --purple-bg:#1e1030;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* loading */
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);font-size:14px;color:var(--muted);z-index:999}

/* header */
header{display:flex;justify-content:space-between;align-items:center;
  padding:16px 40px;border-bottom:1px solid var(--border)}
.brand{color:var(--gold);font-size:17px;font-weight:600;letter-spacing:.4px}
.ts{color:var(--muted);font-size:12px}

/* main */
main{max-width:1200px;margin:0 auto;padding:48px 40px}
h1{font-size:44px;font-weight:700;line-height:1.1;margin-bottom:10px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:44px}
h2{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:16px}

/* kpi */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);background:var(--border);
  gap:1px;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:36px}
.kpi{background:var(--surface);padding:24px 28px}
.kpi-n{font-size:38px;font-weight:700;color:var(--gold);line-height:1}
.kpi-l{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-top:10px}

/* filter pills */
.filters{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.f-label{font-size:11px;letter-spacing:1px;color:var(--muted);margin-right:4px}
.pill{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:5px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--gold-dim);color:var(--text)}
.pill.active{border-color:var(--gold);color:var(--gold)}

/* table */
.tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:52px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface);padding:13px 16px;text-align:left;
  font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr{border-top:1px solid var(--border);transition:.1s}
tbody tr:hover{background:#1f1f1f}
tbody tr.adj{opacity:.45}
td{padding:14px 16px;vertical-align:middle}
.co-cell .co-name{font-weight:600;display:flex;align-items:center;gap:6px}
.site{color:var(--muted);font-size:11px;text-decoration:none;display:block;margin-top:3px}
.site:hover{color:var(--gold)}
.dim-txt{color:var(--muted)}
.adj-tag{font-size:9px;color:#666;border:1px solid #333;border-radius:3px;padding:1px 5px;flex-shrink:0}
.round-lbl{color:var(--gold);font-size:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:500}
.badge.active  {background:var(--green-bg);color:var(--green)}
.badge.acquired{background:var(--purple-bg);color:var(--purple)}
.badge.stealth {background:#222;color:#888}

/* graph */
.graph-header{margin-bottom:12px}
#net-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;margin-bottom:52px}
#net{width:100%;display:block;cursor:grab}
#net:active{cursor:grabbing}
.legend{padding:12px 20px;border-top:1px solid var(--border);
  display:flex;gap:20px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.n-link{stroke:#333;stroke-opacity:.5;stroke-width:1}
.n-link.lead{stroke:var(--gold);stroke-opacity:.8;stroke-width:1.5}
.n-lbl{font-size:10px;fill:var(--muted);pointer-events:none}
.n-lbl.company{fill:var(--text);font-size:11px;font-weight:600}
.n-lbl.shared{fill:#f43f5e}
.dimmed{opacity:.07}

/* analysis */
.analysis{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}
.bar-lab{width:90px;color:var(--muted);text-align:right;white-space:nowrap;flex-shrink:0}
.bar{flex:1;background:#111;border-radius:4px;height:11px;overflow:hidden}
.fill{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dim));border-radius:4px}
.bar-n{width:22px;color:var(--text);font-weight:600}
ul.shared{list-style:none;max-height:420px;overflow:auto}
ul.shared li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
ul.shared li:last-child{border-bottom:none}
.s-name{font-weight:600}
.cnt{color:var(--gold);font-weight:700;font-size:12px}
.cos{color:var(--muted);font-size:11.5px;width:100%;margin-top:2px}

/* detail table */
.detail-section{margin-top:52px}
.dt-filter{width:320px;max-width:100%;padding:8px 12px;border-radius:8px;
  border:1px solid var(--border);background:#111;color:var(--text);
  font-size:13px;margin-bottom:14px}
.dt-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
#dt{width:100%;border-collapse:collapse;font-size:12px;min-width:1400px}
#dt thead th{background:var(--surface);padding:11px 14px;text-align:left;
  font-size:10px;letter-spacing:1.1px;color:var(--muted);font-weight:600;
  white-space:nowrap;position:sticky;top:0;z-index:1}
#dt tbody tr{border-top:1px solid var(--border)}
#dt tbody tr:hover{background:#1f1f1f}
#dt td{padding:12px 14px;vertical-align:top;max-width:300px;line-height:1.5;word-break:break-word}
#dt .dt-name{font-weight:700;white-space:nowrap;color:var(--text)}
.site-lnk{color:var(--gold);text-decoration:none;font-size:12px}
.site-lnk:hover{text-decoration:underline}
.src-cell{white-space:nowrap}
.src-lnk{color:var(--muted);text-decoration:none;margin-right:3px;font-size:11px}
.src-lnk:hover{color:var(--gold)}

@media(max-width:900px){
  header,main{padding-left:20px;padding-right:20px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .analysis{grid-template-columns:1fr}
  h1{font-size:32px}
}
</style>
</head>
<body>

<div id="loading">Loading…</div>

<header>
  <div class="brand">Competitor Intel</div>
  <div class="ts" id="ts"></div>
</header>

<main>
  <h1>Tracked Companies</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="kpi-grid" id="kpis"></div>

  <div class="filters">
    <span class="f-label">STATUS</span>
    <button class="pill active" data-f="all"      onclick="filterStatus('all')">All</button>
    <button class="pill"        data-f="active"   onclick="filterStatus('active')">Active</button>
    <button class="pill"        data-f="stealth"  onclick="filterStatus('stealth')">Stealth</button>
    <button class="pill"        data-f="acquired" onclick="filterStatus('acquired')">Acquired</button>
  </div>

  <div class="tbl-wrap">
    <table id="tbl">
      <thead><tr>
        <th>COMPANY</th><th>STATUS</th><th>HQ</th><th>FOUNDED</th>
        <th>ROUND</th><th>AMOUNT</th><th>DATE</th>
      </tr></thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>

  <div class="graph-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2 style="margin:0">Investor &rarr; Company Network</h2>
    <div style="display:flex;gap:24px;align-items:center;font-size:12px;color:var(--muted)">
      <label style="display:flex;align-items:center;gap:8px">Charge
        <input type="range" id="sl-charge" min="-50" max="10" value="-50" style="width:100px;accent-color:var(--gold)">
        <span id="v-charge" style="min-width:36px">-50</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px">Distance
        <input type="range" id="sl-dist" min="10" max="100" value="30" style="width:100px;accent-color:var(--gold)">
        <span id="v-dist" style="min-width:28px">30</span>
      </label>
    </div>
  </div>
  <div id="net-wrap">
    <svg id="net" height="520"></svg>
    <div class="legend">
      <span><i class="dot" style="background:#C9A442"></i>Company</span>
      <span><i class="dot" style="background:#6b6b6b"></i>Investor</span>
      <span><i class="dot" style="background:#f43f5e"></i>Shared investor (2+)</span>
      <span><i class="dot" style="background:#C9A442;opacity:.6"></i>Lead / strategic link</span>
    </div>
  </div>

  <div class="analysis">
    <div class="card">
      <h2>Funding Stage &mdash; Core Companies</h2>
      <div id="stages"></div>
    </div>
    <div class="card">
      <h2>Shared Backers &mdash; Vet Before Contact</h2>
      <ul class="shared" id="shared"></ul>
    </div>
  </div>

  <div class="detail-section">
    <h2>Full Company Profiles</h2>
    <input class="dt-filter" id="dt-q" placeholder="Search…" oninput="dtFilt()">
    <div class="dt-scroll">
      <table id="dt">
        <thead><tr id="dt-head"></tr></thead>
        <tbody id="dt-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyZNpmB-tuj30_M1uABI9wygCgWgfeDLURtUc_-ITZwHowB0PmZob7ykJQe5QyAMyDleQ/exec';

// ── Data processing ────────────────────────────────────────────────────────

const SKIP_INV = ['undisclosed','not disclosed','individual angels','total',
  'lead not publicly','no external','no notable','n/a','tbd','~$','$','⚠',
  'per pitchbook','per crunchbase'];

function splitTopLevel(s) {
  const parts = []; let depth = 0, cur = '';
  for (const ch of s) {
    if ('(（'.includes(ch)) depth++;
    else if (')）'.includes(ch)) { if (depth > 0) depth--; }
    else if ((ch === ',' || ch === '\n') && depth === 0) {
      if (cur.trim()) parts.push(cur.trim());
      cur = ''; continue;
    }
    cur += ch;
  }
  if (cur.trim()) parts.push(cur.trim());
  return parts;
}

function parseInvestors(raw) {
  if (!raw) return [];
  let s = raw.replace(/[.,;。]?\s*(series\s+[a-e][^:]*:|returning\s*:|earlier\s*:|seed\s*:|pre-?seed\s*:)/gi, ',');
  s = s.replace(/[。；;]/g, ',');
  const out = [], seen = new Set();
  for (const tok of splitTopLevel(s)) {
    const lead = /lead/i.test(tok);
    let name = tok.replace(/[（(].*?[)）]/g, '');
    for (const piece of name.split(/\s+[+&]\s+/)) {
      let n = piece.split(/—|–| - /)[0]
        .replace(/^\s*funds advised by\s+/i, '')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/^[\s⚠️✅·.,;]+|[\s⚠️✅·.,;]+$/g, '');
      if (!n || !/[A-Za-z]/.test(n)) continue;
      const low = n.toLowerCase();
      if (SKIP_INV.some(k => low.includes(k)) || low.startsWith('+') || seen.has(low)) continue;
      seen.add(low);
      out.push({ name: n, lead });
    }
  }
  return out;
}

function fundingStage(lr) {
  const m = (lr || '').match(/(pre-?seed|seed|series\s+[a-e])/i);
  if (m) return m[1].replace(/\s+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  if (/acquired|收购/i.test(lr)) return 'Acquired';
  return 'Other / Grant';
}

function parseRoundName(lr) {
  const m = (lr || '').match(/(pre-?seed|seed|series\s+[a-e]|grant|acquired)/i);
  return m ? m[1].replace(/\s+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '';
}

function parseAmount(lr) {
  const m = (lr || '').match(/\$[\d,.]+\s*[MBKmk]?/);
  return m ? m[0].trim() : '';
}

function parseDate(lr) {
  let m = (lr || '').match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*[\s,]+(\d{4})/i);
  if (m) return `${m[2]}-${m[1].slice(0, 3)}`;
  m = (lr || '').match(/(\d{4})[-/](0[1-9]|1[0-2])/);
  if (m) return `${m[1]}-${m[2]}`;
  m = (lr || '').match(/\b(20\d{2})\b/);
  return m ? m[1] : '';
}

function deriveStatus(lr, inv, trj, val) {
  const s = [lr, inv, trj, val].join(' ').toLowerCase();
  if (/acquired|收购/.test(s)) return 'acquired';
  if (/stealth/.test(s)) return 'stealth';
  return 'active';
}

function isCore(co) {
  return !/⚠/.test([co['Business Model'] || '', co['Technical'] || '', co['stage'] || ''].join(' '));
}

function parseYear(fy) {
  const m = (fy || '').match(/\b(19|20)\d{2}\b/);
  return m ? m[0] : '';
}

function parseHq(fy) {
  if (!fy) return '—';
  let s = fy.replace(/^\d{4}[,;\s]+/, '').trim();
  s = s.replace(/^(originally\s+as\s+\S+[,\s]+|as\s+\S+[,\s]+)/i, '').trim();
  if (!s || s.length < 4 || /^[\d(]/.test(s)) return '—';
  return s.length > 70 ? s.slice(0, 70) + '…' : s;
}

function buildData(rows) {
  const hdrs = rows[0].map(h => (h || '').trim());
  const companies = rows.slice(1)
    .map(row => {
      const co = {};
      hdrs.forEach((h, i) => { co[h] = (row[i] || '').toString().trim(); });
      return co;
    })
    .filter(co => co['Company Name']);

  const enriched = companies.map(co => {
    const lr  = co['Latest Round'] || '';
    const inv = co['Investors'] || '';
    const trj = co['Funding Trajectory'] || '';
    const val = co['Valuation'] || '';
    return Object.assign({}, co, {
      _core:      isCore(co),
      _investors: parseInvestors(inv),
      _stage:     fundingStage(lr),
      _status:    deriveStatus(lr, inv, trj, val),
      _year:      parseYear(co['Founded Year'] || ''),
      _hq:        parseHq(co['Founded Year'] || ''),
      _round:     parseRoundName(lr),
      _amount:    parseAmount(lr),
      _date:      parseDate(lr),
    });
  });

  const core = enriched.filter(c => c._core);

  // Investor ↔ company network (core companies only)
  const invMap = new Map();
  const nodes = [], links = [];
  core.forEach(c => {
    nodes.push({ id: `C::${c['Company Name']}`, label: c['Company Name'], type: 'company', deg: 0 });
    c._investors.forEach(({ name, lead }) => {
      const k = name.toLowerCase();
      if (!invMap.has(k)) invMap.set(k, { label: name, cos: new Set() });
      invMap.get(k).cos.add(c['Company Name']);
      links.push({ source: `C::${c['Company Name']}`, target: `I::${k}`, lead });
    });
  });
  invMap.forEach((v, k) => nodes.push({ id: `I::${k}`, label: v.label, type: 'investor', deg: v.cos.size }));

  const shared = [...invMap.values()]
    .filter(v => v.cos.size >= 2)
    .map(v => ({ investor: v.label, cos: [...v.cos].sort() }))
    .sort((a, b) => b.cos.length - a.cos.length || a.investor.localeCompare(b.investor));

  const STAGE_ORDER = ['Pre-Seed', 'Seed', 'Series A', 'Series B', 'Series C', 'Series D', 'Acquired', 'Other / Grant'];
  const sc = {};
  core.forEach(c => { sc[c._stage] = (sc[c._stage] || 0) + 1; });
  const stages = STAGE_ORDER.filter(k => sc[k]).map(k => [k, sc[k]]);

  const statusCounts = { active: 0, stealth: 0, acquired: 0 };
  enriched.forEach(c => { statusCounts[c._status]++; });

  return { enriched, core, hdrs, graph: { nodes, links }, shared, stages, statusCounts };
}

// ── Rendering ──────────────────────────────────────────────────────────────

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderKpis({ enriched, statusCounts }) {
  const kpi = (n, l) => `<div class="kpi"><div class="kpi-n">${n}</div><div class="kpi-l">${l}</div></div>`;
  document.getElementById('kpis').innerHTML =
    kpi(enriched.length, 'TRACKED') + kpi(statusCounts.active, 'ACTIVE') +
    kpi(statusCounts.stealth, 'STEALTH') + kpi(statusCounts.acquired, 'ACQUIRED');
}

function renderSubtitle({ core }) {
  document.getElementById('subtitle').innerHTML =
    `Mining &amp; subsurface AI startups under watch &mdash; ${core.length} core AI+mining companies.`;
}

function renderMainTable({ enriched }) {
  document.getElementById('tbl-body').innerHTML = enriched.map(c => {
    const site = c['Website'] || '';
    const host = site.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
    const adjTag = c._core ? '' : '<span class="adj-tag">adj</span>';
    return `<tr data-status="${c._status}">
      <td class="co-cell"><div class="co-name">${esc(c['Company Name'])}${adjTag}</div>${site ? `<a class="site" href="${esc(site)}" target="_blank">${esc(host)}</a>` : ''}</td>
      <td><span class="badge ${c._status}">${c._status}</span></td>
      <td class="dim-txt">${esc(c._hq)}</td>
      <td class="dim-txt">${esc(c._year) || '—'}</td>
      <td><span class="round-lbl">${esc(c._round) || '—'}</span></td>
      <td class="dim-txt">${esc(c._amount) || '—'}</td>
      <td class="dim-txt">${esc(c._date) || '—'}</td>
    </tr>`;
  }).join('');
}

function renderStages({ stages }) {
  const max = Math.max(...stages.map(([, n]) => n), 1);
  document.getElementById('stages').innerHTML = stages.map(([lbl, n]) =>
    `<div class="bar-row"><span class="bar-lab">${esc(lbl)}</span><span class="bar"><span class="fill" style="width:${Math.round(n / max * 100)}%"></span></span><span class="bar-n">${n}</span></div>`
  ).join('');
}

function renderShared({ shared }) {
  document.getElementById('shared').innerHTML = shared.map(s =>
    `<li><span class="s-name">${esc(s.investor)}</span><span class="cnt">${s.cos.length}</span><span class="cos">${s.cos.map(esc).join(' · ')}</span></li>`
  ).join('') || '<li style="color:var(--muted);font-size:12px">No shared investors found.</li>';
}

function renderDetailTable({ enriched, hdrs }) {
  const DETAIL_COLS = ['Company Name', 'Website', 'Founders', 'Founded Year', 'Business Model',
    'Technical', 'stage', 'Latest Round', 'Funding Trajectory', 'Investors', 'Valuation', 'source：'];
  const cols = DETAIL_COLS.filter(h => hdrs.includes(h));
  document.getElementById('dt-head').innerHTML = cols.map(h =>
    `<th>${esc(h === 'source：' ? 'Sources' : h)}</th>`).join('');
  document.getElementById('dt-body').innerHTML = enriched.map(c => {
    return '<tr>' + cols.map(h => {
      const v = c[h] || '';
      if (h === 'Company Name') return `<td><span class="dt-name">${esc(v)}</span></td>`;
      if (h === 'Website')      return `<td>${v ? `<a class="site-lnk" href="${esc(v)}" target="_blank">${esc(v)}</a>` : '—'}</td>`;
      if (h === 'source：') {
        const lnks = v.split(/\n+/).filter(Boolean)
          .map((u, i) => `<a class="src-lnk" href="${esc(u.trim())}" target="_blank">[${i + 1}]</a>`).join('');
        return `<td class="src-cell">${lnks || '—'}</td>`;
      }
      return `<td>${esc(v) || '—'}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function renderD3Graph({ graph }) {
  const G = graph;
  const svg = d3.select('#net');
  const W = svg.node().getBoundingClientRect().width || 1100;
  const H = +svg.attr('height');
  svg.attr('viewBox', `0 0 ${W} ${H}`);

  const r   = d => d.type === 'company' ? 9 : 4 + Math.min(d.deg || 1, 5) * 1.8;
  const col = d => d.type === 'company' ? '#C9A442' : d.deg >= 2 ? '#f43f5e' : '#555';
  const linkDist = d => {
    const maxDeg = Math.max(d.source.deg || 0, d.target.deg || 0);
    return maxDeg > 8 ? 60 : maxDeg > 3 ? 40 : 30;
  };

  const sim = d3.forceSimulation(G.nodes)
    .force('link',   d3.forceLink(G.links).id(d => d.id).distance(linkDist))
    .force('charge', d3.forceManyBody().strength(-50))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('x',      d3.forceX(W / 2).strength(.04))
    .force('y',      d3.forceY(H / 2).strength(.04))
    .force('collide',d3.forceCollide(d => r(d) + 6));

  const linkSel = svg.append('g').selectAll('line').data(G.links).join('line')
    .attr('class', d => 'n-link' + (d.lead ? ' lead' : ''));

  const nodeSel = svg.append('g').selectAll('circle').data(G.nodes).join('circle')
    .attr('r', r).attr('fill', col).attr('stroke', '#0f0f0f').attr('stroke-width', 1.5)
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on('mouseenter', (_, d) => hi(d.id))
    .on('mouseleave', () => clearHi());

  const lblSel = svg.append('g').selectAll('text').data(G.nodes).join('text')
    .attr('class', d => 'n-lbl' + (d.type === 'company' ? ' company' : d.deg >= 2 ? ' shared' : ''))
    .text(d => d.label)
    .style('display', d => d.type === 'investor' && d.deg < 2 ? 'none' : null);

  sim.on('tick', () => {
    G.nodes.forEach(d => {
      d.x = Math.max(20, Math.min(W - 20, d.x));
      d.y = Math.max(16, Math.min(H - 16, d.y));
    });
    linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
           .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
    lblSel.attr('x', d => d.x + r(d) + 3).attr('y', d => d.y + 4);
  });

  const adj = new Map(G.nodes.map(n => [n.id, new Set([n.id])]));
  G.links.forEach(l => { adj.get(l.source.id)?.add(l.target.id); adj.get(l.target.id)?.add(l.source.id); });

  function hi(id) {
    const keep = adj.get(id) || new Set([id]);
    nodeSel.classed('dimmed', d => !keep.has(d.id));
    lblSel.classed('dimmed', d => !keep.has(d.id))
          .style('display', d => d.type === 'investor' && d.deg < 2 ? (keep.has(d.id) ? null : 'none') : null);
    linkSel.classed('dimmed', d => d.source.id !== id && d.target.id !== id);
  }
  function clearHi() {
    nodeSel.classed('dimmed', false);
    lblSel.classed('dimmed', false).style('display', d => d.type === 'investor' && d.deg < 2 ? 'none' : null);
    linkSel.classed('dimmed', false);
  }

  const slC = document.getElementById('sl-charge'), vC = document.getElementById('v-charge');
  const slD = document.getElementById('sl-dist'),   vD = document.getElementById('v-dist');
  slC.oninput = () => { vC.textContent = slC.value; sim.force('charge').strength(+slC.value); sim.alpha(.3).restart(); };
  slD.oninput = () => { vD.textContent = slD.value; sim.force('link').distance(+slD.value); sim.alpha(.3).restart(); };
}

// ── Status filter & detail search ──────────────────────────────────────────

function filterStatus(s) {
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.f === s));
  document.querySelectorAll('#tbl-body tr').forEach(tr =>
    tr.style.display = (s === 'all' || tr.dataset.status === s) ? '' : 'none');
}

function dtFilt() {
  const q = document.getElementById('dt-q').value.toLowerCase();
  document.querySelectorAll('#dt-body tr').forEach(tr =>
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none');
}

// ── Bootstrap ──────────────────────────────────────────────────────────────

async function init() {
  const loading = document.getElementById('loading');
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length < 2) throw new Error('Empty sheet response');

    const data = buildData(rows);
    renderKpis(data);
    renderSubtitle(data);
    renderMainTable(data);
    renderStages(data);
    renderShared(data);
    renderDetailTable(data);
    renderD3Graph(data);

    document.getElementById('ts').textContent =
      'Updated ' + new Date().toUTCString().replace(/:\d\d GMT$/, ' UTC');
    loading.style.display = 'none';
  } catch (err) {
    loading.textContent = 'Failed to load data — ' + err.message;
    loading.style.color = '#f43f5e';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
